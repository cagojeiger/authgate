{{define "content"}}
<div>
  <div class="step">Step 1 of 2</div>
  <h1>Enter your device code</h1>
</div>

<p>Type the code shown in your terminal. You will be asked to approve access on the next screen.</p>

{{if .Error}}<div class="alert" role="alert">{{.Error}}</div>{{end}}

<div class="note">Codes look like <code>XXXX-XXXX</code>, for example <code>BCDF-GHKM</code>.</div>

<form method="GET" action="/device">
  <label for="user_code">Device code</label>
  <input id="user_code" type="text" name="user_code" maxlength="9"
         placeholder="XXXX-XXXX" value="{{.UserCode}}"
         autocomplete="off" autocapitalize="characters" spellcheck="false"
         autofocus required>
  <button type="submit" class="btn">Continue</button>
</form>
{{end}}
{{template "layout" .}}
