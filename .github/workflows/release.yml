name: Release

on:
  push:
    branches: [main]
    paths:
      - VERSION

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: version
        run: echo "version=v$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Create git tag
        run: |
          git tag ${{ steps.version.outputs.version }}
          git push origin ${{ steps.version.outputs.version }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          generate_release_notes: true

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/authgate:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/authgate:latest
          build-args: |
            VERSION=${{ steps.version.outputs.version }}

      - name: Delete old GHCR images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner_type=$(gh api "/repos/${{ github.repository }}" --jq '.owner.type')
          if [[ "$owner_type" == "Organization" ]]; then
            packages_path="/orgs/${{ github.repository_owner }}/packages"
          else
            packages_path="/users/${{ github.repository_owner }}/packages"
          fi

          mapfile -t version_ids < <(
            gh api --paginate \
              "$packages_path/container/authgate/versions?per_page=100" \
              --jq '.[] | select(((.metadata.container.tags // []) | index("latest")) | not) | .id'
          )

          versions_to_keep=20
          if (( ${#version_ids[@]} <= versions_to_keep )); then
            exit 0
          fi

          for version_id in "${version_ids[@]:versions_to_keep}"; do
            gh api --method DELETE \
              "$packages_path/container/authgate/versions/${version_id}"
          done
